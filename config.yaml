# multilingual-tts 설정 파일
# CLI 옵션이 있으면 이 설정보다 우선합니다

supertonic:
  voice: M2          # F1 F2 F3 F4 F5 / M1 M2 M3 M4 M5
  speed: 1.0        # 발화 속도 (0.5 ~ 2.0)
  steps: 16           # 생성 품질 단계 (4~16, 높을수록 느리고 품질 좋음)
  sample_rate: 8000  # 출력 wav sample rate (Hz). 비워두면 모델 기본값 그대로 사용, 지정 시 자동 리샘플링
                     # 8000은 전화 음질이라 ㅎ/ㅅ/ㅊ 구분이 원리적으로 힘들다. 재생 장비가 받아준다면 16000 권장.
  candidates: 3      # 한 문장을 몇 번 생성해서 가장 또렷한 것을 고를지 (best-of-N).
                     # 모델 샘플러가 확률적이라 짧은 문장일수록 음절이 뭉개지거나 마지막 음절을
                     # 삼키는 실패 take가 섞인다. 기대 음절 수를 채운 take가 나오면 즉시 멈추므로
                     # 평소 속도 손해는 거의 없다. 1로 두면 예전(1회 생성) 동작.
  candidates_max_units: 25  # 이 음절 수를 넘는 긴 문장은 후보 선별을 건너뜀
  gain:              # TTS 음성 음량 배율 (종소리/효과음 wav는 미적용). 비워두면(기본) 매 요청마다 클리핑 직전까지 자동으로 최대 음량으로 맞춤(피크 정규화). 숫자를 넣으면 그 배율을 고정으로 곱함(예: 1.4) — 과증폭 시 [-1, 1]로 자동 clip

output:
  directory: output  # 출력 폴더

api:
  host: 0.0.0.0
  port: 9090
  output_directory: output   # 상대경로는 실행파일이 위치한 설치 디렉터리 기준

# 참고: 문장 안 쉼표(,)/말줄임표(...)/(……)는 각각 +0.2s/+0.8s/+1.2s 간격이 자동 적용됨

# API의 soundEffect 필드(0~10)로 tts 맨 앞에 삽입할 종소리 wav.
# 0이면 무시, 1~5면 wav_1x를 그 횟수만큼, 6~10이면 wav_2x를 (N-5)회 반복해서 tts 본문 앞에 붙입니다.
sound_effect:
  wav_1x: sounds/captain_bell_1x.wav
  wav_2x: sounds/captain_bell_2x.wav

# 텍스트 안 <별칭> 태그로 삽입할 wav 파일 매핑
# 사용 예: "안내드립니다 <시작 종> 잠시 후 시작합니다."
# 경로가 상대경로면 설치 디렉터리(프로젝트 루트) 기준으로 찾습니다.
sfx:
  알림: sounds/notify.wav
  경고음: sounds/alert.wav
  성공음: sounds/success.wav
  함장승함 종1회: sounds/captain_bell_1x.wav
  함장승함 종2회: sounds/captain_bell_2x.wav
  타종2회: sounds/ship_bell.wav

# 발음 교정 사전 — 합성 직전에 텍스트를 그대로 치환한다.
# Supertonic v3는 G2P 없이 문자를 먹는 모델이라 한국어의 모음 사이 ㅎ 약화를
# 그대로 학습했다: "하함"은 [하암]처럼 흘러 "함" 하나로 들린다.
# 모델이 또렷하게 읽는 표기로 바꿔주는 것이 가장 확실한 해결책이다.
# ㆍ(U+318D, 아래아)는 소리로 읽히지 않으면서 음절 경계를 강제하는 구분자로 쓸 수 있다.
pronunciation:
  하함: 하ㆍ함
